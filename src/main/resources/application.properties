spring.application.name=aws-document-api

# Profile-specific files (application-<profile>.properties) supply datasource + storage location.
# 'local' is used unless SPRING_PROFILES_ACTIVE says otherwise (later: 'aws').
spring.profiles.default=local

# Flyway owns the schema; Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health endpoint for humans now, ALB health checks later.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Errors are rendered by ApiExceptionHandler as RFC 9457 problem details. The fallback
# /error page (only reached outside MVC) must never leak internals either.
server.error.include-stacktrace=never
server.error.include-message=never

# Java 21+ virtual threads for Tomcat and the @Async executor: cheap threads, no pool sizing to tune.
spring.threads.virtual.enabled=true

# PUT /documents/{id}/content takes raw bytes. Spring's form-content filter would otherwise consume
# the body of any PUT sent as application/x-www-form-urlencoded (curl's default) as form fields.
spring.mvc.formcontent.filter.enabled=false
