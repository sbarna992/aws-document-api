spring.application.name=aws-document-api

# Profile-specific files (application-<profile>.properties) supply datasource + storage location.
# 'local' is used unless SPRING_PROFILES_ACTIVE says otherwise (later: 'aws').
spring.profiles.default=local

# Flyway owns the schema; Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health endpoint for humans now, ALB health checks later.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
