spring.application.name=aws-document-api

# Profile-specific files (application-<profile>.properties) supply datasource + storage location.
# 'local' is used unless SPRING_PROFILES_ACTIVE says otherwise (later: 'aws').
spring.profiles.default=local

# Flyway owns the schema; Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Health endpoint for humans now, ALB health checks later.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Errors are rendered by ApiExceptionHandler as RFC 9457 problem details. The fallback
# /error page (only reached outside MVC) must never leak internals either.
server.error.include-stacktrace=never
server.error.include-message=never

# Java 21+ virtual threads for Tomcat and the @Async executor: cheap threads, no pool sizing to tune.
spring.threads.virtual.enabled=true

# PUT /documents/{id}/content takes raw bytes. Spring's form-content filter would otherwise consume
# the body of any PUT sent as application/x-www-form-urlencoded (curl's default) as form fields.
spring.mvc.formcontent.filter.enabled=false

# Where document bytes live: 'local' (a directory, the default) or 's3' (a private bucket; Phase 2).
# With 's3' the API hands out presigned URLs and never touches bytes. Values come from the
# environment; there is no secret among them - credentials come from the SDK's provider chain.
documents.storage.type=${DOCAPI_STORAGE_TYPE:local}
documents.storage.s3.bucket=${DOCAPI_BUCKET:}
documents.storage.s3.prefix=documents/
documents.storage.s3.presign-ttl=${DOCAPI_PRESIGN_TTL:PT15M}

# Largest document accepted (ADR 14). On S3 enforced after the fact by the confirm endpoint.
documents.max-file-size=${DOCAPI_MAX_FILE_SIZE:10MB}
