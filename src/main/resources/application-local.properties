spring.datasource.url=jdbc:postgresql://localhost:5432/documentdb
spring.datasource.username=docapi
# No default on purpose: the value comes only from the environment (user-level env var DOCAPI_DB_PASSWORD).
# A wrong or missing value fails fast at startup - that is the proof it is really read from outside.
spring.datasource.password=${DOCAPI_DB_PASSWORD}

# Where document bytes live locally. Replaced by an S3 bucket in the 'aws' profile.
documents.storage.local.root=./local-storage/documents

logging.level.com.sandeep.awsdocumentapi=DEBUG
