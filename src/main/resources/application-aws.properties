# Profile used when the API runs on AWS (Phase 4 onwards). Everything environment-specific comes
# from environment variables / Parameter Store / Secrets Manager; nothing here is a secret.

# P0.S4 decision: the load balancer needs a status code, the internet needs nothing else.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Phase 3 fills these from the Secrets Manager secret via the systemd start-up wrapper.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Phase 2 selects the S3 adapter; until then the local adapter is the only one.
documents.storage.local.root=${DOCAPI_STORAGE_ROOT:/var/lib/docapi/documents}

logging.level.com.sandeep.awsdocumentapi=INFO
